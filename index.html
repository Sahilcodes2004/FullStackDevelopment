<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel ="stylesheet" href="style.css">
</head>
<body>
    
<div id="container">
    <input id="disp" type="text" readonly>

    <div class="row">
    <button id="reset" class="button" onclick="delte()">C</button>
    <button id="delete" class="button" onclick="deleteLastElement()">X</button>
    <button id="mod" class="button" onclick="append('%')">%</button>
    <button id="add" class="button" onclick="append('+')">+</button>

    </div>
<div class="row">
    <button id="1" class="button" onclick="append('1')">1</button>
    <button id="2" class="button" onclick="append('2')">2</button>
    <button id="3" class="button" onclick="append('3')">3</button>
    <button id="sub" class="button" onclick="append('-')">-</button>

</div>
<div class="row">
    <button id="4" class="button" onclick="append('4')">4</button>
    <button id="5" class="button" onclick="append('5')">5</button>
    <button id="6" class="button" onclick="append('6')">6</button>
    <button id="*" class="button" onclick="append('*')">*</button>

</div>
<div class="row">
    <button id="7" class="button" onclick="append('7')">7</button>
    <button id="8" class="button" onclick="append('8')">8</button>
    <button id="9" class="button" onclick="append('9')">9</button>
    <button id="divide" class="button" onclick="append('/')">/</button>
    
</div>
<div class="row">
    <button id="0" class="button" onclick="append('0')">0</button>
    <button id="." class="button" onclick="append('.')">.</button>
    <button id="calculate" class="button" onclick="calculate()">=</button>
</div>
</div>
<script src="index.js"></script>

</body>
</html>
